AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Module NAT Gateway - Elastic IP + NAT Gateway đặt trong Public Subnet

Parameters:
  ProjectName:
    Type: String
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id

Resources:
  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnetId
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat-gw"

Outputs:
  NatGatewayId:
    Value: !Ref NatGateway
  NatPublicIp:
    Value: !Ref NatEIP
