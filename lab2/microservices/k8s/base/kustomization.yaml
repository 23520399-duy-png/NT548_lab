apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nt548
labels:
  - pairs:
      app.kubernetes.io/part-of: nt548-lab02
    includeSelectors: false
resources:
  - namespace.yaml
  - product-service.yaml
  - order-service.yaml
  - gateway.yaml
# Jenkins ghi đè newTag bằng tag của build (BUILD_NUMBER-gitsha)
images:
  - name: nt548/product-service
    newName: localhost:5001/nt548/product-service
    newTag: "1.0.0"
  - name: nt548/order-service
    newName: localhost:5001/nt548/order-service
    newTag: "1.0.0"
  - name: nt548/gateway
    newName: localhost:5001/nt548/gateway
    newTag: "1.0.0"
