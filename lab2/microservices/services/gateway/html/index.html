<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NT548 Lab 02 – Microservices Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>NT548 Lab 02 – Microservices Shop</h1>
    <p>gateway (nginx) → product-service (FastAPI) · order-service (Express)</p>
  </header>
  <main>
    <section>
      <h2>Sản phẩm</h2>
      <table id="products"><thead><tr><th>ID</th><th>Tên</th><th>Giá</th><th>Tồn kho</th><th></th></tr></thead><tbody></tbody></table>
    </section>
    <section>
      <h2>Đơn hàng</h2>
      <p id="message" role="status"></p>
      <table id="orders"><thead><tr><th>ID</th><th>Sản phẩm</th><th>SL</th><th>Tổng</th></tr></thead><tbody></tbody></table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
