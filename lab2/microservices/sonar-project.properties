# Cấu hình SonarQube cho 3 microservice (chạy sonar-scanner tại lab02/microservices)
sonar.projectKey=nt548-lab02-microservices
sonar.projectName=NT548 Lab02 - Microservices
sonar.sourceEncoding=UTF-8

# Mã nguồn & mã test
sonar.sources=services/product-service/app,services/order-service/src,services/gateway
sonar.tests=services/product-service/tests,services/order-service/tests
sonar.exclusions=**/node_modules/**,**/.venv/**,**/coverage/**,**/reports/**

# Python (product-service)
sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=services/product-service/coverage.xml
sonar.python.xunit.reportPath=services/product-service/reports/junit.xml

# JavaScript (order-service)
sonar.javascript.lcov.reportPaths=services/order-service/coverage/lcov.info
