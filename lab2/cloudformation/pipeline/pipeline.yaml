AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  NT548 Lab 02 (Câu 2) - CI/CD cho CloudFormation: CodeCommit -> CodeBuild
  (cfn-lint + Taskcat) -> CloudFormation deploy, điều phối bởi CodePipeline.
  Dùng LabRole có sẵn của AWS Academy (Learner Lab không cho tạo IAM Role).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Source" }
        Parameters: [SourceProvider, RepositoryName, CreateRepository, BranchName, SourceObjectKey]
      - Label: { default: "Pipeline" }
        Parameters: [ServiceRoleName, RunTaskcat, RequireManualApproval]
      - Label: { default: "Hạ tầng được triển khai" }
        Parameters: [InfraStackName, InfraProjectName, AllowedSshCidr, KeyName, InstanceProfileName]

Parameters:
  SourceProvider:
    Type: String
    Description: Nguồn mã. CodeCommit (yêu cầu đề bài) hoặc S3 (dự phòng nếu tài khoản không dùng được CodeCommit)
    AllowedValues: [CodeCommit, S3]
    Default: CodeCommit
  RepositoryName:
    Type: String
    Default: nt548-lab02-cfn
    AllowedPattern: "^[\\w.-]{1,100}$"
  CreateRepository:
    Type: String
    Description: Tạo mới CodeCommit repository (false nếu repo đã tồn tại)
    AllowedValues: ["true", "false"]
    Default: "true"
  BranchName:
    Type: String
    Default: main
  SourceObjectKey:
    Type: String
    Description: (Chỉ dùng khi SourceProvider = S3) key của file zip mã nguồn trong ArtifactBucket
    Default: source/nt548-lab02-cfn.zip
  ServiceRoleName:
    Type: String
    Description: IAM Role cho CodePipeline/CodeBuild/CloudFormation (AWS Academy - LabRole)
    Default: LabRole
  RunTaskcat:
    Type: String
    Description: Chạy taskcat test run (tạo stack thật rồi xoá, ~10-15 phút)
    AllowedValues: ["true", "false"]
    Default: "true"
  RequireManualApproval:
    Type: String
    Description: Thêm bước duyệt tay trước khi Deploy
    AllowedValues: ["true", "false"]
    Default: "false"
  InfraStackName:
    Type: String
    Default: nt548-lab02-cfn-infra
  InfraProjectName:
    Type: String
    Default: nt548-lab02-cfn
  AllowedSshCidr:
    Type: String
    Description: IP của bạn dạng x.x.x.x/32 (curl -s https://checkip.amazonaws.com)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(3[0-2]|[12]?\d)$'
  KeyName:
    Type: String
    Default: vockey
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile

Rules:
  DenyOpenSsh:
    Assertions:
      - Assert: !Not [!Equals [!Ref AllowedSshCidr, "0.0.0.0/0"]]
        AssertDescription: AllowedSshCidr KHÔNG được là 0.0.0.0/0

Conditions:
  UseCodeCommit: !Equals [!Ref SourceProvider, CodeCommit]
  CreateRepo: !And [!Condition UseCodeCommit, !Equals [!Ref CreateRepository, "true"]]
  NeedApproval: !Equals [!Ref RequireManualApproval, "true"]

Resources:
  # --------------------------------------------------------------------------
  # S3 bucket chứa artifact của pipeline + template con của nested stack
  # --------------------------------------------------------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${RepositoryName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled # bắt buộc khi dùng S3 làm Source
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # --------------------------------------------------------------------------
  # CodeCommit repository chứa mã CloudFormation
  # --------------------------------------------------------------------------
  Repository:
    Type: AWS::CodeCommit::Repository
    Condition: CreateRepo
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref RepositoryName
      RepositoryDescription: NT548 Lab 02 - CloudFormation templates (VPC, NAT, Route Tables, SG, EC2)

  # --------------------------------------------------------------------------
  # CodeBuild projects
  # --------------------------------------------------------------------------
  ValidateLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${RepositoryName}-validate"
      RetentionInDays: 7

  TaskcatLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${RepositoryName}-taskcat"
      RetentionInDays: 7

  ValidateProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${RepositoryName}-validate"
      Description: cfn-lint + validate-template + upload template con lên S3
      ServiceRole: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ServiceRoleName}"
      TimeoutInMinutes: 15
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspecs/buildspec-validate.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: TEMPLATES_BUCKET, Value: !Ref ArtifactBucket }
          - { Name: ALLOWED_SSH_CIDR, Value: !Ref AllowedSshCidr }
          - { Name: KEY_NAME, Value: !Ref KeyName }
          - { Name: INSTANCE_PROFILE, Value: !Ref InstanceProfileName }
          - { Name: PROJECT_NAME, Value: !Ref InfraProjectName }
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref ValidateLogGroup

  TaskcatProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${RepositoryName}-taskcat"
      Description: taskcat test run - triển khai thử template thật rồi xoá
      ServiceRole: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ServiceRoleName}"
      TimeoutInMinutes: 60
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspecs/buildspec-taskcat.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: RUN_TASKCAT, Value: !Ref RunTaskcat }
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref TaskcatLogGroup

  # --------------------------------------------------------------------------
  # CodePipeline: Source -> Validate -> Test -> (Approve) -> Deploy
  # --------------------------------------------------------------------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${RepositoryName}-pipeline"
      RoleArn: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ServiceRoleName}"
      RestartExecutionOnUpdate: false
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - !If
              - UseCodeCommit
              - Name: CodeCommit
                ActionTypeId:
                  Category: Source
                  Owner: AWS
                  Provider: CodeCommit
                  Version: "1"
                Configuration:
                  RepositoryName: !Ref RepositoryName
                  BranchName: !Ref BranchName
                  # AWS Academy không cho tạo IAM Role cho EventBridge -> dùng polling
                  PollForSourceChanges: true
                OutputArtifacts:
                  - Name: SourceOutput
                RunOrder: 1
              - Name: S3Source
                ActionTypeId:
                  Category: Source
                  Owner: AWS
                  Provider: S3
                  Version: "1"
                Configuration:
                  S3Bucket: !Ref ArtifactBucket
                  S3ObjectKey: !Ref SourceObjectKey
                  PollForSourceChanges: true
                OutputArtifacts:
                  - Name: SourceOutput
                RunOrder: 1

        - Name: Validate
          Actions:
            - Name: cfn-lint
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref ValidateProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1

        - Name: Test
          Actions:
            - Name: taskcat
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref TaskcatProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: TaskcatReport
              RunOrder: 1

        - !If
          - NeedApproval
          - Name: Approve
            Actions:
              - Name: ManualApproval
                ActionTypeId:
                  Category: Approval
                  Owner: AWS
                  Provider: Manual
                  Version: "1"
                Configuration:
                  CustomData: Kiểm tra kết quả cfn-lint và taskcat trước khi deploy hạ tầng
                RunOrder: 1
          - !Ref AWS::NoValue

        - Name: Deploy
          Actions:
            - Name: CloudFormation
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref InfraStackName
                TemplatePath: BuildOutput::templates/main.yaml
                TemplateConfiguration: BuildOutput::build/config.json
                Capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND
                RoleArn: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ServiceRoleName}"
                OutputFileName: stack-outputs.json
              InputArtifacts:
                - Name: BuildOutput
              OutputArtifacts:
                - Name: DeployOutput
              RunOrder: 1

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  PipelineConsoleUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}"
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  RepositoryCloneUrlHttp:
    Condition: UseCodeCommit
    Value: !Sub "https://git-codecommit.${AWS::Region}.amazonaws.com/v1/repos/${RepositoryName}"
  RepositoryGrcUrl:
    Condition: UseCodeCommit
    Description: URL dùng với git-remote-codecommit (hoạt động với credentials tạm thời của AWS Academy)
    Value: !Sub "codecommit::${AWS::Region}://${RepositoryName}"
  SourceS3Uri:
    Value: !Sub "s3://${ArtifactBucket}/${SourceObjectKey}"
  InfraStackName:
    Value: !Ref InfraStackName
