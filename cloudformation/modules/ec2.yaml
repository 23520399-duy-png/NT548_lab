AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Module EC2 - Module dùng chung tạo 1 EC2 instance (gọi 2 lần: public & private).
  Hardening: bắt buộc IMDSv2, mã hoá EBS root volume.

Parameters:
  InstanceName:
    Type: String
  Role:
    Type: String
    AllowedValues: [public, private]
  AmiId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t2.small, t3.micro, t3.small, t3.medium]
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  AssociatePublicIp:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

Resources:
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref SecurityGroupId
          AssociatePublicIpAddress: !Ref AssociatePublicIp
          DeleteOnTermination: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 8
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Ref InstanceName
        - Key: Role
          Value: !Ref Role

Outputs:
  InstanceId:
    Value: !Ref Instance
  PrivateIp:
    Value: !GetAtt Instance.PrivateIp
  PublicIp:
    # Private instance không có PublicIp -> trả về chuỗi rỗng
    Value: !If [HasPublicIp, !GetAtt Instance.PublicIp, ""]

Conditions:
  HasPublicIp: !Equals [!Ref AssociatePublicIp, "true"]
